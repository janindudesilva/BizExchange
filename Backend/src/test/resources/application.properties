# Test configuration for BizExchange using isolated in-memory H2 database
jwt.secret=DEVELOPMENT_AND_TEST_SECRET_AT_LEAST_32_BYTES_LONG_FOR_HMAC_SHA256
jwt.expiration=86400000

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

app.otp.expiry.minutes=10
app.otp.max-attempts=5
app.password.min-length=8
app.password.max-failed-attempts=5

app.admin.email=admin@bizexchange.local
app.admin.password=AdminTestPassword123!
app.admin.full-name=Admin Test

resend.api-key=test_key
resend.from-address=test@example.com

spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@example.com
spring.mail.password=test
