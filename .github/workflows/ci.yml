name: CI Pipeline

on:
  push:
    branches: [ main, master, staging, develop ]
  pull_request:
    branches: [ main, master, staging, develop ]

jobs:
  backend-regression-and-migrations:
    name: Backend Tests & PostgreSQL Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: BizExchange
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password_secure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x Backend/mvnw

      - name: Run Backend Regression & PostgreSQL Migration Tests
        working-directory: Backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/BizExchange
          DB_USERNAME: postgres
          DB_PASSWORD: ci_test_password_secure
          JWT_SECRET: ci-temporary-test-jwt-secret-with-sufficient-entropy-32chars!
          ADMIN_EMAIL: ci-admin@bizexchange.test
          ADMIN_PASSWORD: CiAdminTestPassword123!
          FRONTEND_URL: http://localhost:3000
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          SPRING_PROFILES_ACTIVE: local
        run: |
          ./mvnw clean test

  frontend-build-and-lint:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: Frontend
        run: npm ci

      - name: Run Frontend Lint
        working-directory: Frontend
        run: npm run lint

      - name: Run Frontend Production Build
        working-directory: Frontend
        env:
          NEXT_PUBLIC_API_URL: https://staging-api.bizexchange.lk/api
          NEXT_PUBLIC_SITE_URL: https://staging.bizexchange.lk
        run: npm run build
